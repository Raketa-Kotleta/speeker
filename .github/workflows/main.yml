name: Build and Deploy Vite App

on:
  push:
    branches:
      - main # Укажите имя вашей главной ветки (main или master)

permissions:
  contents: write # Даем экшену право записывать собранные файлы в ветку gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build # Vite скомпилирует проект в папку dist

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Для Vite всегда указывается папка dist
          branch: gh-pages
